<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多國語言字典</title>
    <style>
        /* 1. 定義各語言的主題顏色變數 */
        :root {
            /* 預設顏色 (綠色) */
            --theme-color: #4CAF50;
            --theme-hover-color: #45a049;
        }

        body.theme-ko {
            /* 韓文主題：深藍色 */
            --theme-color: #3f51b5;
            --theme-hover-color: #303f9f;
        }

        body.theme-ja {
            /* 日文主題：櫻花粉色/櫻紅 */
            --theme-color: #e91e63;
            --theme-hover-color: #c2185b;
        }

        body.theme-en {
            /* 英文主題：琥珀橘色 */
            --theme-color: #ff9800;
            --theme-hover-color: #f57c00;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease;
        }

        header {
            /* 使用 CSS 變數 */
            background-color: var(--theme-color);
            color: white;
            padding: 10px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        section {
            margin: 20px;
        }

        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
            border-top: 5px solid var(--theme-color);
            transition: border-color 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="text"][readonly] {
            background-color: #e9ecef;
        }

        .btn-group {
            margin-top: 15px;
        }

        input[type="submit"], input[type="button"] {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"] {
            /* 送出按鈕使用主題顏色 */
            background-color: var(--theme-color);
            color: white;
        }

        input[type="submit"]:hover {
            background-color: var(--theme-hover-color);
        }

        input[type="button"] {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>多國語言字典</h1>
    </header>
    <section>
        <div class="form-box">
            <form action="/ask" method="post">
                <div class="form-group">
                    <label for="question">中文:</label>
                    <input type="text" id="question" name="question" value="{{ question }}" required>
                </div>

                <!-- 語言選擇下拉選單 -->
                <div class="form-group">
                    <label for="lang">選擇翻譯語言:</label>
                    <select id="lang" name="lang" onchange="changeTheme(this.value)">
                        <option value="ko" {% if selected_lang == 'ko' %}selected{% endif %}>韓文</option>
                        <option value="ja" {% if selected_lang == 'ja' %}selected{% endif %}>日文</option>
                        <option value="en" {% if selected_lang == 'en' %}selected{% endif %}>英文</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="answer">翻譯結果:</label>
                    <input type="text" id="answer" name="answer" readonly value="{{ answer }}">
                </div>

                <div class="btn-group">
                    <input type="submit" value="送出">
                    <input type="button" value="回首頁" onclick="window.location.href='/'">
                </div>
            </form>
        </div>
    </section>

    <!-- JavaScript 切換主題邏輯 -->
    <script>
        function changeTheme(lang) {
            // 移除舊的主題 class
            document.body.classList.remove('theme-ko', 'theme-ja', 'theme-en');
            
            // 依據選擇的語言加入對應的 class
            if (lang) {
                document.body.classList.add('theme-' + lang);
            }
        }

        // 頁面載入時根據預設選取的語言初始化主題顏色
        document.addEventListener('DOMContentLoaded', function() {
            const langSelect = document.getElementById('lang');
            if (langSelect) {
                changeTheme(langSelect.value);
            }
        });
    </script>
</body>
</html>
